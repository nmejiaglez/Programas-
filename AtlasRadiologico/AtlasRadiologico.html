<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Radiológico</title>
<style>
:root{--az:#123A78;--azc:#EAF1FA;--gr:#F4F7FB;--do:#C9A227;--ro:#C00028;--tx:#222B38;--bg:#ffffff;--pn:#ffffff;--bd:#d6dfeb;--mu:#5b6778;--us:#0e7c86;--tc:#7a4a00;--rm:#5b2a86;--rx:#2f5d2f;--mg:#a3346b;--lienzo:#05070a;--rotulo:#e6ebf2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--az:#7fb0ff;--azc:#16243a;--gr:#1a2230;--tx:#e6ebf2;--bg:#0f141c;--pn:#151c27;--bd:#2a3546;--mu:#9aa6b8;--ro:#ff6b81;--us:#2aa7b0;--tc:#b9822a;--rm:#8a5cc7;--rx:#4f8f4f;--mg:#c95a92}}
:root[data-theme="dark"]{--az:#7fb0ff;--azc:#16243a;--gr:#1a2230;--tx:#e6ebf2;--bg:#0f141c;--pn:#151c27;--bd:#2a3546;--mu:#9aa6b8;--ro:#ff6b81;--us:#2aa7b0;--tc:#b9822a;--rm:#8a5cc7;--rx:#4f8f4f;--mg:#c95a92}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#123A78;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:3px solid #C9A227;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;min-width:180px}
header small{display:block;font-weight:normal;opacity:.8;font-size:11px}
#q{flex:2;min-width:180px;padding:8px 10px;border-radius:6px;border:0;font-size:14px}
.hb{background:transparent;color:#fff;border:1px solid #fff6;border-radius:6px;padding:7px 10px;cursor:pointer}
nav.mods{display:flex;gap:6px;padding:8px 16px;background:var(--azc);border-bottom:1px solid var(--bd);overflow-x:auto}
nav.mods button{border:1px solid var(--bd);background:var(--pn);color:var(--tx);padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:bold;white-space:nowrap}
nav.mods button.on{background:var(--az);color:var(--bg);border-color:var(--az)}
.wrap{display:grid;grid-template-columns:270px 1fr}
aside{border-right:1px solid var(--bd);background:var(--pn);overflow-y:auto;height:calc(100vh - 104px);position:sticky;top:104px}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 14px 4px}
aside a{display:block;padding:7px 14px;color:var(--tx);text-decoration:none;border-left:3px solid transparent;font-size:13.5px;cursor:pointer;line-height:1.3}
aside a:hover{background:var(--gr)}
aside a.on{border-left-color:var(--do);background:var(--azc);font-weight:bold}
aside .ord{font-size:11px;color:var(--mu);padding:8px 14px 0}
.tag{font-size:10px;font-weight:bold;padding:2px 6px;border-radius:4px;margin-left:6px;color:#fff;vertical-align:middle;white-space:nowrap}
.t-US{background:var(--us)}.t-TC{background:var(--tc)}.t-RM{background:var(--rm)}.t-RX{background:var(--rx)}.t-MG{background:var(--mg)}
main{padding:16px 20px;min-width:0}
.ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl h2{margin:0;color:var(--az);font-size:21px}
.sub{color:var(--mu);margin:4px 0 10px;font-size:13.5px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--az);margin:10px 0 12px;flex-wrap:wrap}
.tabs button{border:0;background:var(--gr);color:var(--tx);padding:8px 13px;border-radius:6px 6px 0 0;cursor:pointer;font-weight:bold;font-size:13px}
.tabs button.on{background:var(--az);color:var(--bg)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar .grp{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.bar button{border:0;border-right:1px solid var(--bd);background:var(--pn);color:var(--tx);padding:6px 10px;cursor:pointer;font-size:12.5px}
.bar .grp button:last-child{border-right:0}
.bar button.on{background:var(--az);color:var(--bg);font-weight:bold}
.bar .lb{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.atlas{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.lz{background:var(--lienzo);border-radius:10px;border:1px solid var(--bd);overflow:hidden}
.lz canvas{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation}
.panel{position:sticky;top:116px}
.info{background:var(--pn);border:1px solid var(--bd);border-left:4px solid var(--do);border-radius:8px;padding:10px 12px;margin-bottom:10px;min-height:96px}
.info h4{margin:0 0 6px;color:var(--az);font-size:15px}
.info p{margin:4px 0;font-size:13.5px;line-height:1.45}
.info .sg{font-size:12.5px;color:var(--mu);background:var(--gr);padding:6px 8px;border-radius:6px}
.lista{background:var(--pn);border:1px solid var(--bd);border-radius:8px;max-height:calc(100vh - 360px);overflow:auto}
.lista input{width:100%;border:0;border-bottom:1px solid var(--bd);padding:8px 10px;background:var(--pn);color:var(--tx);font-size:13px;position:sticky;top:0}
.lista div{padding:6px 10px;font-size:13px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;gap:6px}
.lista div:hover{background:var(--gr)}
.lista div.on{background:var(--azc);font-weight:bold}
.lista b{color:var(--do);min-width:22px;text-align:right}
.quizbox{background:var(--az);color:var(--bg);padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:14px}
.quizbox b{font-size:16px}
.quizbox .ok{color:#7CFC9A}.quizbox .no{color:#ffb3c0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.im{background:#000;border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--bd);position:relative}
.im img{width:100%;height:190px;object-fit:contain;display:block;background:#000}
.im .c{font-size:11px;color:#cfd8e6;padding:6px 8px;background:#0b0f14;height:44px;overflow:hidden;line-height:1.3}
.im .mk{position:absolute;top:6px;right:6px;background:var(--do);color:#000;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:4px}
.more{margin:12px 0;padding:9px 16px;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:6px;cursor:pointer;font-weight:bold}
.note{background:var(--gr);border:1px solid var(--bd);border-left:4px solid var(--do);padding:10px 12px;border-radius:6px;font-size:13px;margin:10px 0;line-height:1.45}
section.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;overflow:hidden}
section.card h4{margin:0;background:var(--az);color:var(--bg);padding:8px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
section.card .bd{padding:10px 14px;font-size:14px;line-height:1.5}
section.card ul{margin:0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--azc);text-align:left;padding:6px 8px;color:var(--az)}
td{padding:6px 8px;border-top:1px solid var(--bd)}
tr:nth-child(even) td{background:var(--gr)}
.pat li b{color:var(--ro)}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer}
.tile:hover{border-color:var(--do)}
.tile b{color:var(--az)}
.tile p{margin:6px 0 0;font-size:12px;color:var(--mu)}
.res{margin:6px 0 14px}
.res div{padding:7px 10px;border:1px solid var(--bd);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:13.5px;background:var(--pn)}
.res div:hover{border-color:var(--do)}
#menu{display:none}
#vw{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#vw.open{display:flex}
#vbar{display:flex;gap:6px;align-items:center;padding:8px;background:#0b0f14;color:#e6ebf2;flex-wrap:wrap;font-size:12px}
#vbar button{background:#1a2230;color:#e6ebf2;border:1px solid #2a3546;border-radius:6px;padding:6px 10px;cursor:pointer}
#vbar button.on{background:#C9A227;color:#000}
#vbar label{display:flex;align-items:center;gap:4px}
#vbar input[type=range]{width:90px}
#vst{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#vin{position:absolute;left:0;top:0;transform-origin:0 0}
#vin img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto}
.pin i{display:block;width:22px;height:22px;border-radius:50%;background:#C9A227;color:#000;font:bold 12px/22px Arial;text-align:center;font-style:normal;border:2px solid #fff;box-shadow:0 0 6px #000}
.pin span{position:absolute;left:26px;top:2px;white-space:nowrap;background:#000c;color:#fff;font-size:13px;padding:2px 6px;border-radius:4px;border:1px solid #C9A227}
#vfoot{background:#0b0f14;color:#9aa6b8;font-size:11px;padding:6px 10px;max-height:90px;overflow:auto}
#vfoot a{color:#7fb0ff}
#vlist{position:absolute;right:8px;top:8px;width:230px;max-height:60%;overflow:auto;background:#0b0f14ee;border:1px solid #2a3546;border-radius:8px;color:#e6ebf2;font-size:12px;padding:6px;display:none}
#vlist.on{display:block}
#vlist div{display:flex;justify-content:space-between;gap:4px;padding:3px 0;border-bottom:1px solid #2a3546}
#vlist button{background:none;border:0;color:#ff6b81;cursor:pointer}
@media (max-width:1100px){.atlas{grid-template-columns:1fr}.panel{position:static}.lista{max-height:320px}}
@media (max-width:820px){
 .wrap{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;bottom:0;width:82%;max-width:310px;height:auto;z-index:20;transform:translateX(-100%);transition:.2s;box-shadow:0 0 20px #0008}
 aside.open{transform:none}
 #menu{display:block}
 main{padding:12px 16px}
 .gal{grid-template-columns:repeat(2,1fr)}
 .im img{height:140px}
}
</style>
</head>
<body>
<header>
 <button id="menu" class="hb" aria-label="Menú">☰</button>
 <h1>Atlas Radiológico <small>Anatomía seccional rotulada · US · TC · RM · RX · Mamografía — Dr. Néstor José Mejía González · MINSA 37294</small></h1>
 <input id="q" type="search" placeholder="Buscar estructura o corte (ej. segmento VIII, cápsula interna, LCA, Wirsung)">
 <button id="tema" class="hb" title="Cambiar tema">◐</button>
</header>
<nav class="mods" id="mods"></nav>
<div class="wrap">
 <aside id="side"></aside>
 <main id="main"></main>
</div>
<div id="vw">
 <div id="vbar">
  <button id="vx">✕ Cerrar</button>
  <button id="vprev">‹</button><button id="vnext">›</button>
  <button id="vzi">＋</button><button id="vzo">－</button><button id="vfit">Ajustar</button>
  <label>Brillo <input id="vb" type="range" min="40" max="200" value="100"></label>
  <label>Contraste <input id="vc" type="range" min="40" max="250" value="100"></label>
  <button id="vinv">Invertir</button>
  <button id="vlab">📍 Rotular</button>
  <button id="vls">Rótulos</button>
  <button id="vhide">Ocultar rótulos</button>
  <button id="vsave">☆ Guardar en Mi atlas</button>
 </div>
 <div id="vst"><div id="vin"><img id="vimg" alt=""></div><div id="vlist"></div></div>
 <div id="vfoot"></div>
</div>
<script>
/* ===================== TEJIDOS =====================
   us: ecogenicidad 0–1 · at: atenuación acústica (sombra) · fl: líquido (refuerzo posterior)
   hu: UH en TC simple · hc: UH con contraste IV · t1/t2/fr: señal relativa RM (0–1)
   rx: densidad radiográfica · op: 'add' suma densidad en proyección (hueso, glándula) */
const T = {
 fondo_us:  {us:.32},
 piel:      {us:.85,hu:40,t1:.5,t2:.4,fr:.4,rx:.4},
 grasa_sc:  {us:.3,hu:-100,t1:.92,t2:.75,fr:.8,rx:.28},
 grasa:     {us:.78,hu:-100,t1:.92,t2:.75,fr:.8,rx:.28},
 musculo:   {us:.27,hu:50,hc:60,t1:.38,t2:.2,fr:.25,rx:.42},
 tendon:    {us:.78,hu:85,t1:.05,t2:.05,fr:.05},
 higado:    {us:.5,hu:60,hc:110,t1:.56,t2:.3,fr:.3},
 bazo:      {us:.56,hu:48,hc:120,t1:.42,t2:.58,fr:.5},
 pancreas:  {us:.62,hu:45,hc:110,t1:.62,t2:.4,fr:.4},
 rinon:     {us:.4,hu:35,hc:180,t1:.46,t2:.56,fr:.5},
 med_renal: {us:.16,hu:35,hc:115,t1:.34,t2:.72,fr:.55},
 suprarrenal:{us:.5,hu:30,hc:70,t1:.45,t2:.4,fr:.4},
 intestino: {us:.45,hu:40,hc:90,t1:.4,t2:.45,fr:.4},
 liquido:   {us:0,fl:1,hu:5,hc:5,t1:.07,t2:.97,fr:.05,rx:.42},
 sangre:    {us:.02,fl:.7,hu:42,hc:270,t1:.08,t2:.06,fr:.06,t1c:.95},
 vena:      {us:.02,fl:.7,hu:40,hc:160,t1:.12,t2:.1,fr:.1,t1c:.85},
 hueso:     {us:1,at:1,hu:1200,t1:.04,t2:.04,fr:.04,rx:.55,op:'add'},
 esponjoso: {us:1,at:1,hu:260,t1:.8,t2:.55,fr:.5,rx:.35,op:'add'},
 calcio:    {us:1,at:1,hu:450,t1:.05,t2:.05,fr:.05,rx:.6,op:'add'},
 aire:      {us:.92,at:1,hu:-1000,t1:0,t2:0,fr:0,rx:0},
 pulmon:    {us:.55,at:1,hu:-860,t1:.02,t2:.03,fr:.02,rx:.1},
 cisura:    {us:.55,at:1,hu:-450,t1:.03,t2:.04,fr:.03},
 gris:      {us:.36,hu:38,hc:42,t1:.42,t2:.62,fr:.62},
 blanca:    {us:.42,hu:28,hc:30,t1:.66,t2:.38,fr:.42},
 palido:    {us:.4,hu:33,hc:36,t1:.5,t2:.45,fr:.45},
 dura:      {us:.85,hu:58,hc:90,t1:.2,t2:.1,fr:.1},
 miometrio: {us:.45,hu:50,hc:120,t1:.4,t2:.5,fr:.45},
 zona_union:{us:.22,hu:50,hc:110,t1:.4,t2:.12,fr:.12},
 endometrio:{us:.8,hu:50,hc:90,t1:.4,t2:.9,fr:.7},
 ovario:    {us:.38,hu:35,hc:80,t1:.35,t2:.7,fr:.5},
 testiculo: {us:.5,hu:40,hc:80,t1:.4,t2:.8,fr:.6},
 epididimo: {us:.54,hu:40,hc:80,t1:.4,t2:.55,fr:.5},
 prostata_zp:{us:.42,hu:40,hc:80,t1:.38,t2:.85,fr:.6},
 prostata_zt:{us:.34,hu:40,hc:80,t1:.38,t2:.38,fr:.35},
 ves_seminal:{us:.3,hu:25,hc:40,t1:.3,t2:.9,fr:.6},
 tiroides:  {us:.68,hu:100,hc:160,t1:.5,t2:.45,fr:.45},
 cartilago: {us:.05,hu:90,t1:.4,t2:.55,fr:.5},
 fibrocart: {us:.66,hu:80,t1:.04,t2:.04,fr:.04},
 nucleo:    {us:.4,hu:80,t1:.35,t2:.93,fr:.6},
 anillo:    {us:.6,hu:90,t1:.3,t2:.1,fr:.1},
 medula:    {us:.3,hu:35,hc:38,t1:.52,t2:.45,fr:.45},
 nervio:    {us:.55,hu:40,t1:.4,t2:.5,fr:.45},
 interfase: {us:.96,hu:50,t1:.3,t2:.2,fr:.2},
 plexo:     {us:.88,hu:60,hc:110,t1:.42,t2:.5,fr:.45},
 glandula:  {us:.8,hu:40,hc:60,t1:.35,t2:.4,fr:.4},
 neurohip:  {us:.4,hu:40,hc:90,t1:.95,t2:.5,fr:.5},
 // radiografía / mamografía (proyección)
 rx_blando: {rx:.42},
 rx_med:    {rx:.55},
 rx_pulmon: {rx:.1},
 rx_aire:   {rx:.12},
 rx_grasa:  {rx:.3},
 rx_hueso:  {rx:.22,op:'add'},
 rx_cortical:{rx:.4,op:'add'},
 rx_vaso:   {rx:.08,op:'add'},
 mg_grasa:  {rx:.2},
 mg_glan:   {rx:.3,op:'add'},
 mg_musc:   {rx:.5},
 mg_piel:   {rx:.55},
 mg_gang:   {rx:.25,op:'add'}
};

const NOMBRE_T = {piel:'piel',grasa_sc:'grasa subcutánea',grasa:'grasa',musculo:'músculo',tendon:'tendón',higado:'parénquima hepático',bazo:'parénquima esplénico',pancreas:'parénquima pancreático',rinon:'corteza renal',med_renal:'médula renal',suprarrenal:'glándula suprarrenal',intestino:'pared intestinal',liquido:'líquido',sangre:'sangre arterial / cavidad',vena:'sangre venosa',hueso:'hueso cortical',esponjoso:'hueso esponjoso / médula ósea',calcio:'calcificación',aire:'aire / gas',pulmon:'pulmón aireado',cisura:'cisura pleural',gris:'sustancia gris',blanca:'sustancia blanca',palido:'globo pálido',dura:'duramadre',miometrio:'miometrio',zona_union:'zona de unión',endometrio:'endometrio',ovario:'estroma ovárico',testiculo:'parénquima testicular',epididimo:'epidídimo',prostata_zp:'zona periférica prostática',prostata_zt:'zona de transición prostática',ves_seminal:'vesícula seminal',tiroides:'parénquima tiroideo',cartilago:'cartílago hialino',fibrocart:'fibrocartílago / ligamento',nucleo:'núcleo pulposo',anillo:'anillo fibroso',medula:'médula espinal',nervio:'nervio',interfase:'interfase ecogénica',plexo:'plexo coroideo',glandula:'tejido fibroglandular',neurohip:'neurohipófisis'};

function nivel(v,pal){return v<.06?pal[0]:v<.3?pal[1]:v<.5?pal[2]:v<.75?pal[3]:pal[4];}
/* Descripción de señal / ecogenicidad / densidad según modalidad */
function senal(t,grupo){const x=T[t];if(!x)return '';
 if(grupo=='US'){if(t=='interfase')return 'Interfase lineal marcadamente hiperecogénica (reflector especular).';
  let s=nivel(x.us,['Anecoico','Hipoecoico','Ecogenicidad intermedia','Hiperecoico','Marcadamente hiperecogénico']);
  if(x.at)s+=t=='pulmon'||t=='aire'?', con reverberación y sombra sucia posterior':', con sombra acústica posterior limpia';
  if(x.fl==1)s+=', con refuerzo acústico posterior';return s+'.';}
 if(grupo=='RX'||grupo=='MG'){const v=x.rx??.4;return (x.op?'Radiodensidad que se suma a la de estructuras superpuestas':v<.2?'Radiolúcido (aire)':v<.35?'Densidad grasa':v<.5?'Densidad de partes blandas':'Densidad aumentada')+'.';}
 const p=['hipointenso marcado (vacío de señal)','hipointenso','intermedio / isointenso','hiperintenso','hiperintenso marcado'];
 let s='';
 if(grupo=='AX')s+=`TC: ≈ ${x.hu} UH en fase simple${x.hc&&x.hc!=x.hu?`; ≈ ${x.hc} UH con contraste IV`:''}. `;
 if(x.t1!=null)s+=`RM: T1 ${nivel(x.t1,p)}; T2 ${nivel(x.t2,p)}${x.fr!=null&&grupo!='AX'||t=='liquido'?`; FLAIR ${nivel(x.fr,p)}`:''}.`;
 return s;}

/* ===================== MOTOR DE RENDER =====================
   Geometría en unidades 0–100. Formatos:
   'e cx cy rx ry [rot]'  elipse      'r cx cy rx ry w [rot]'  anillo
   'p x,y x,y …' contorno suave cerrado   'q x,y …' polígono
   'l w x,y …' tubo suave abierto (ancho w)   'k w x,y …' tubo recto
   'pt x y' punto (rótulo sin dibujo) */
const GEO = {};
function geo(g){if(GEO[g])return GEO[g];
 const t=g.trim().split(/\s+/),k=t[0],n=t.slice(1).map(v=>v.includes(',')?v.split(',').map(Number):Number(v));
 const path=new Path2D();let o={path,w:0,k};
 if(k=='e'||k=='r'){const [cx,cy,rx,ry]=n;const w=k=='r'?n[4]:0,rot=(k=='r'?n[5]:n[4])||0;
  path.ellipse(cx,cy,rx,ry,rot*Math.PI/180,0,Math.PI*2);o.w=w;o.sp=[cx,cy,rx,ry];o.a=[cx,k=='r'?cy-ry:cy];o.c=[cx,cy];o.r=Math.max(rx,ry);}
 else if(k=='pt'){o.a=[n[0],n[1]];path.arc(n[0],n[1],3.5,0,Math.PI*2);o.pt=1;}
 else{let pts=n,w=0;if(k=='l'||k=='k'){w=n[0];pts=n.slice(1);}o.w=w;
  const cl=k=='p'||k=='q';
  if(k=='q'||k=='k'){pts.forEach((p,i)=>i?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1]));}
  else spline(path,pts,cl);
  if(cl)path.closePath();
  o.a=cl?[pts.reduce((s,p)=>s+p[0],0)/pts.length,pts.reduce((s,p)=>s+p[1],0)/pts.length]:pts[Math.floor((pts.length-1)/2)].slice();
  if(!cl&&pts.length%2==0){const p1=pts[pts.length/2-1],p2=pts[pts.length/2];o.a=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];}
  o.pts=pts;}
 return GEO[g]=o;}

function costillas(){const s=[];
 for(let i=0;i<10;i++){const y=14+i*6.6;
  s.push([i==0?'Arcos costales posteriores':'Arco costal posterior','rx_hueso',`l 1.4 49,${y} 38,${y-2} 24,${y+1} 14,${y+8}`,i==0?'Más horizontales y densos; se cuentan para valorar la inspiración (≥ 9–10 arcos sobre el diafragma derecho).':'',i==0?{a:[30,y-1]}:{nl:1}]);
  s.push(['Arco costal posterior','rx_hueso',`l 1.4 51,${y} 62,${y-2} 76,${y+1} 86,${y+8}`,'',{nl:1}]);
  if(i<7){s.push([i==0?'Arcos costales anteriores':'Arco costal anterior','rx_hueso',`l 1.1 14,${y+4} 24,${y+11} 36,${y+15}`,i==0?'Oblicuos hacia abajo y medial; su porción cartilaginosa no es visible salvo calcificación.':'',i==0?{a:[24,y+11]}:{nl:1}]);
   s.push(['Arco costal anterior','rx_hueso',`l 1.1 86,${y+4} 76,${y+11} 64,${y+15}`,'',{nl:1}]);}}
 return s;}
function vertebras(x,y0,n,h,w,nombre){const s=[];for(let i=0;i<n;i++){const y=y0+i*h;
 s.push([nombre?`${nombre}${i+1}`:'Cuerpo vertebral','rx_hueso',`q ${x-w},${y} ${x+w},${y} ${x+w},${y+h*.78} ${x-w},${y+h*.78}`,i==0?'Cuerpos vertebrales alineados; espacios discales conservados.':'',i==0||nombre?{}:{nl:1}]);
 s.push(['Pedículos','rx_cortical',`e ${x-w*.62} ${y+h*.3} ${w*.22} ${h*.2}`,i==0?'Óvalos corticales (“ojos”); su ausencia sugiere lesión lítica (signo del guiño).':'',i==0?{}:{nl:1}]);
 s.push(['Pedículo','rx_cortical',`e ${x+w*.62} ${y+h*.3} ${w*.22} ${h*.2}`,'',{nl:1}]);
 s.push(['Apófisis espinosa','rx_cortical',`e ${x} ${y+h*.5} ${w*.16} ${h*.22}`,i==0?'Alineadas en línea media; su desviación indica rotación.':'',i==0?{}:{nl:1}]);}
 return s;}

/* ---------- Imágenes: Wikimedia Commons (licencias libres) ---------- */
const cache={};
async function commons(q,offset=0){
 const k=q+'|'+offset;if(cache[k])return cache[k];
 const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=30&gsroffset='+offset+
  '&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=1600';
 const r=await fetch(u);const j=await r.json();
 const pages=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index);
 const out=pages.filter(p=>p.imageinfo&&/jpeg|png|gif|webp/.test(p.imageinfo[0].mime)).map(p=>{const ii=p.imageinfo[0],m=ii.extmetadata||{};
  return{t:p.title.replace(/^File:/,'').replace(/\.[a-z]+$/i,'').replace(/_/g,' '),src:ii.thumburl||ii.url,th:(ii.thumburl||ii.url).replace(/\/\d+px-/,'/400px-'),page:ii.descriptionurl,
   desc:strip(m.ImageDescription?.value).slice(0,400),aut:strip(m.Artist?.value).slice(0,120),lic:m.LicenseShortName?.value||''};});
 return cache[k]={items:out,next:j.continue?.gsroffset};
}

/* ---------- Mi atlas (imágenes propias / guardadas) ---------- */
let db;
function idb(){return new Promise((ok,ko)=>{if(db)return ok(db);const r=indexedDB.open('atlas-rad',1);r.onupgradeneeded=()=>r.result.createObjectStore('img',{keyPath:'id'});r.onsuccess=()=>ok(db=r.result);r.onerror=()=>ko(r.error);});}
async function dbAll(){const d=await idb();return new Promise(ok=>{const r=d.transaction('img').objectStore('img').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>ok([]);});}
async function dbPut(o){const d=await idb();return new Promise(ok=>{const t=d.transaction('img','readwrite');t.objectStore('img').put(o);t.oncomplete=ok;});}
async function dbDel(id){const d=await idb();return new Promise(ok=>{const t=d.transaction('img','readwrite');t.objectStore('img').delete(id);t.oncomplete=ok;});}

const CORTES=[...CORTES_US,...CORTES_AX,...CORTES_RM,...CORTES_RX];
const MODS={US:'Ecografía',TC:'Tomografía',RM:'Resonancia',RX:'Radiografía',MG:'Mamografía'};
const enMod=(p,m)=>m=='US'?p.g=='US':m=='TC'?p.g=='AX':m=='RM'?(p.g=='AX'||p.g=='RMS'):m=='RX'?p.g=='RX':p.g=='MG';
const seqsDe=(p,m)=>m=='US'?['US']:m=='TC'?p.tc:m=='RM'?p.rm:m=='RX'?['RX']:['MG'];
const grupoSenal=(p,m)=>m=='US'?'US':p.g=='AX'?'AX':p.g=='RMS'?'RMS':m;
const refDe=(p,m)=>m=='TC'?p.refTC:m=='RM'?(p.refRM||p.ref):p.ref;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent.trim();};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const movil=()=>innerWidth<760;

let mod=LS.get('atlas-mod','US'),cur=null,tab='atlas',seq=null,modo=null,sel=null,quiz=null,GAL=[];

function navMods(){$('#mods').innerHTML=Object.entries(MODS).map(([k,v])=>`<button class="${k==mod?'on':''}" data-m="${k}">${v} <span style="opacity:.6;font-weight:normal">${CORTES.filter(p=>enMod(p,k)).length}</span></button>`).join('')+`<button data-mi="1">⭐ Mi atlas</button>`;}
function lista(){const q=$('#q').value.trim().toLowerCase();
 const it=CORTES.filter(p=>enMod(p,mod)&&(!q||(p.n+' '+p.est+' '+p.s.map(s=>s[0]).join(' ')).toLowerCase().includes(q)));
 const g={};it.forEach(p=>(g[p.est]=g[p.est]||[]).push(p));
 $('#side').innerHTML=`<a data-home="1">🏠 Inicio · ${MODS[mod]}</a><div class="ord">Orden: cefálico → caudal</div>`+(it.length?Object.entries(g).map(([r,xs])=>`<h3>${r}</h3>`+xs.map(p=>`<a data-id="${p.id}" class="${cur==p.id?'on':''}">${esc(p.n)}</a>`).join('')).join(''):'<p style="padding:14px;color:var(--mu)">Sin resultados.</p>');
 return it;}

function home(){cur=null;quiz=null;const it=lista();const q=$('#q').value.trim().toLowerCase();
 let res='';
 if(q.length>=3){const hits=[];CORTES.forEach(p=>{if(!enMod(p,mod))return;p.s.forEach((s,i)=>{if(s[1]!='dash'&&!(s[4]||{}).nl&&s[0].toLowerCase().includes(q))hits.push({p,i,s});});});
  if(hits.length)res=`<h3 style="color:var(--az);margin:8px 0">Estructuras encontradas (${hits.length})</h3><div class="res">${hits.slice(0,40).map(h=>`<div data-id="${h.p.id}" data-sel="${h.i}"><b>${esc(h.s[0])}</b> — <span style="color:var(--mu)">${esc(h.p.n)}</span></div>`).join('')}</div>`;}
 const nE=it.reduce((a,p)=>a+rotulables(p).length,0);
 $('#main').innerHTML=`<div class="ttl"><span class="tag t-${mod}" style="margin:0">${mod}</span><h2>${MODS[mod]}</h2></div>
 <p class="sub">${it.length} cortes · ${nE} estructuras rotuladas en español, ordenadas de cefálico a caudal.</p>
 <div class="note">Cada corte es una <b>imagen anatómica reconstruida con la apariencia de la modalidad</b> (speckle y sombra acústica en ecografía; ventanas en UH en TC; contraste T1/T2/FLAIR en RM; proyección en radiografía y mamografía). Las estructuras están <b>señaladas en la imagen</b>; al tocarlas se muestra su descripción anatómica y su <b>ecogenicidad, densidad o señal</b>. En TC y RM puede cambiar la ventana o la secuencia. La pestaña <b>Casos reales</b> busca imágenes de pacientes reales (Wikimedia Commons) y <b>Mis imágenes</b> guarda sus propias capturas rotulables.</div>
 ${res}<div class="home">${it.map(p=>`<div class="tile" data-id="${p.id}"><b>${esc(p.n)}</b><p>${esc(p.est)} · ${rotulables(p).length} estructuras${p.g=='AX'?' · TC y RM':''}</p></div>`).join('')}</div>`;}

function abrirCorte(id,t,s){const p=CORTES.find(x=>x.id==id);if(!p)return home();
 if(!enMod(p,mod)){mod=p.g=='US'?'US':p.g=='RMS'?'RM':p.g=='AX'?mod=='RM'?'RM':'TC':p.g;navMods();}
 if(cur!=id){seq=null;sel=null;quiz=null;}cur=id;tab=t||'atlas';if(s!=null)sel=+s;
 const seqs=seqsDe(p,mod);if(!seq||!seqs.includes(seq))seq=seqs[0];
 if(!modo)modo=movil()?'numeros':'nombres';
 lista();const ref=refDe(p,mod),f=ref&&A.find(x=>x.id==ref);
 $('#main').innerHTML=`<div class="ttl"><span class="tag t-${mod}" style="margin:0">${MODS[mod]}</span><h2>${esc(p.n)}</h2></div><p class="sub">${esc(p.est)} · ${esc(p.cab||'')}</p>
 <div class="tabs"><button data-tab="atlas" class="${tab=='atlas'?'on':''}">🩻 Anatomía rotulada</button>${f?`<button data-tab="ref" class="${tab=='ref'?'on':''}">📋 Técnica, valores y patología</button>`:''}<button data-tab="img" class="${tab=='img'?'on':''}">🖼 Casos reales</button><button data-tab="mis" class="${tab=='mis'?'on':''}">⭐ Mis imágenes</button></div>

 if(tab=='ref'&&f)return fichaRef(f);
 if(tab=='img')return reales(p);

  <span class="lb">Rótulos</span><div class="grp">${['nombres','numeros','ocultos'].map(m=>`<button data-modo="${m}" class="${m==modo&&!quiz?'on':''}">${{nombres:'Nombres',numeros:'Números',ocultos:'Ocultos'}[m]}</button>`).join('')}</div>

 pintarLista(p);dibujar(p);mostrarInfo(p);
 const cv=$('#cv');cv.onclick=e=>clicLienzo(p,e);
 $('#flt').oninput=()=>pintarLista(p);}
function dibujar(p){const cv=$('#cv');if(!cv)return;const m=quiz?(quiz.ver?'numeros':'ocultos'):modo;
 const t0=performance.now();vistaAtlas.geo=dibujarCorte(cv,p,seq,m,quiz?quiz.marca:sel,{dash:!!quiz});}
function pintarLista(p){const L=rotulables(p),f=($('#flt')?.value||'').toLowerCase();
 const box=$('#lst');box.querySelectorAll('div').forEach(d=>d.remove());
 box.insertAdjacentHTML('beforeend',L.map((i,k)=>({i,k})).filter(o=>!f||p.s[o.i][0].toLowerCase().includes(f)).map(o=>`<div data-s="${o.i}" class="${o.i==sel?'on':''}"><b>${o.k+1}</b><span>${quiz&&!quiz.ver?'• • •':esc(p.s[o.i][0])}</span></div>`).join(''));}
function mostrarInfo(p){const box=$('#info');if(!box)return;
 if(quiz){const ob=p.s[quiz.obj];box.innerHTML=`<div class="quizbox">Toque en la imagen:<br><b>${esc(ob[0])}</b><br>${quiz.msg||''}<br><span style="font-size:12px">Aciertos ${quiz.ok} / ${quiz.n}</span></div><button class="more" style="margin:0" id="qsig">Siguiente ›</button> <button class="more" style="margin:0" id="qver">Ver respuesta</button>`;
  $('#qsig').onclick=()=>{nuevaPregunta(p);};$('#qver').onclick=()=>{quiz.marca=quiz.obj;quiz.msg='Respuesta resaltada en dorado.';dibujar(p);mostrarInfo(p);};return;}
 if(sel==null){box.innerHTML=`<h4>${rotulables(p).length} estructuras</h4><p>Seleccione una estructura para ver su ubicación, relaciones y su ${mod=='US'?'ecogenicidad':mod=='TC'?'densidad (UH)':mod=='RM'?'señal en T1/T2':'densidad radiográfica'}.</p>`;return;}
 const s=p.s[sel],L=rotulables(p),n=L.indexOf(sel)+1;
 const sig=s[1]!='-'?senal(s[1],grupoSenal(p,mod)):'';
 box.innerHTML=`<h4>${n}. ${esc(s[0])}</h4>${s[3]?`<p>${esc(s[3])}</p>`:''}${sig?`<p class="sg"><b>${s[1]=='-'?'':'Tejido: '+esc(NOMBRE_T[s[1]]||s[1])+'. '}</b>${esc(sig)}</p>`:'<p class="sg">Región o reparo anatómico (señalado con punto).</p>'}`;}
function seleccionar(p,i){sel=i;dibujar(p);mostrarInfo(p);pintarLista(p);
 const el=$(`#lst div[data-s="${i}"]`);if(el)el.scrollIntoView({block:'nearest'});}
function clicLienzo(p,e){const cv=$('#cv'),r=cv.getBoundingClientRect(),k=cv.width/r.width;
 const px=(e.clientX-r.left)*k,py=(e.clientY-r.top)*k,G=vistaAtlas.geo;
 if(!quiz&&modo=='nombres'&&dibujarCorte.boxes){const b=dibujarCorte.boxes.find(o=>o.box&&px>=o.box[0]-4&&px<=o.box[0]+o.box[2]+4&&py>=o.box[1]&&py<=o.box[1]+o.box[3]);if(b)return seleccionar(p,b.i);}
 const u=[(px-G.M)/G.S,py/G.S];if(u[0]<0||u[0]>100)return;
 let i=null;
 if(modo=='numeros'||(quiz&&quiz.ver)){const L=rotulables(p);let best=null,bd=14;L.forEach(j=>{const g=geo(p.s[j][2]),a=anc(p.s[j],g);const d=Math.hypot(px-(G.M+a[0]*G.S),py-a[1]*G.S);if(d<bd){bd=d;best=j;}});i=best;}
 if(i==null)i=hit(p,u);
 if(quiz){quiz.n++;const ok=i==quiz.obj;if(ok)quiz.ok++;quiz.msg=ok?'<span class="ok">✔ Correcto</span>':`<span class="no">✘ Tocó: ${esc(i!=null?p.s[i][0]:'zona sin rótulo')}</span>`;quiz.marca=quiz.obj;dibujar(p);mostrarInfo(p);setTimeout(()=>{if(quiz&&cur==p.id)nuevaPregunta(p);},ok?900:2200);return;}
 if(i!=null)seleccionar(p,i);}
function nuevaPregunta(p){const L=rotulables(p).filter(i=>p.s[i][1]!='-'||true);quiz.obj=L[Math.floor(Math.random()*L.length)];quiz.marca=null;quiz.msg='';dibujar(p);mostrarInfo(p);pintarLista(p);}

function fichaRef(a){$('#cont').innerHTML=`
 <section class="card"><h4>Técnica</h4><div class="bd">${a.tec}</div></section>
 <section class="card"><h4>Anatomía / semiología normal</h4><div class="bd"><ul>${a.anat.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>
 <section class="card"><h4>Valores de referencia</h4><div class="bd" style="padding:0"><table><tr><th>Parámetro</th><th>Valor</th></tr>${a.val.map(v=>`<tr><td>${v[0]}</td><td><b>${v[1]}</b></td></tr>`).join('')}</table></div></section>
 <section class="card"><h4>Patología frecuente — signos clave</h4><div class="bd"><ul class="pat">${a.pat.map(p=>`<li><b>${p[0]}.</b> ${p[1]}</li>`).join('')}</ul></div></section>
 <section class="card"><h4>Clasificaciones</h4><div class="bd">${a.cls}</div></section>`;}

/* ---- Casos reales (Wikimedia Commons) ---- */
function reales(p){const c=$('#cont');const q=(mod=='TC'?'CT ':mod=='RM'?'MRI ':mod=='US'?'ultrasound ':'')+(p.q||p.n);
 c.innerHTML=`<div class="note">Imágenes de pacientes reales con licencia libre (Wikimedia Commons), cargadas en vivo; requiere internet. Las que tienen rótulos aparecen primero. Ábralas para ampliar, ajustar brillo/contraste y colocar sus propios rótulos.</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><input id="q2" value="${esc(q.trim())}" style="flex:1;min-width:200px;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--pn);color:var(--tx)"><button class="more" style="margin:0" id="bq2">Buscar</button></div>
 <div class="gal" id="gal"><p>Cargando imágenes…</p></div><div id="pg"></div>`;
 $('#bq2').onclick=()=>cargar(p,$('#q2').value,0,true);$('#q2').onkeydown=e=>{if(e.key=='Enter')$('#bq2').click();};
 cargar(p,q,0,true);}
async function cargar(p,q,off,reset){const g=$('#gal');if(reset){GAL=[];g.innerHTML='<p>Cargando imágenes…</p>';}
 try{let items=[],next;
  if(off==0){const [x,y]=await Promise.all([commons(q+' labeled'),commons(q)]);const seen=new Set();items=[...x.items,...y.items].filter(i=>!seen.has(i.src)&&seen.add(i.src));next=y.next;}
  else{const y=await commons(q,off);items=y.items;next=y.next;}
  items.sort((a,b)=>LAB.test(b.t+b.desc)-LAB.test(a.t+a.desc));
  if(cur!=p.id||tab!='img')return;
  const ini=GAL.length,est=rotulables(p).map(i=>p.s[i][0]);GAL.push(...items.map(i=>({...i,reg:p.id,est})));
  if(reset)g.innerHTML='';
  if(!GAL.length)g.innerHTML='<p>Sin resultados. Pruebe otros términos en inglés (ej. "sonography", "axial", "T2").</p>';
  g.insertAdjacentHTML('beforeend',items.map((i,k)=>`<div class="im" data-g="${ini+k}"><img loading="lazy" src="${esc(i.th)}" alt="${esc(i.t)}" onerror="this.closest('.im').remove()">${LAB.test(i.t+i.desc)?'<span class="mk">ROTULADA</span>':''}<div class="c">${esc(i.t)}</div></div>`).join(''));
  $('#pg').innerHTML=next?`<button class="more" id="bmas">Cargar más</button>`:'';if(next)$('#bmas').onclick=()=>cargar(p,q,next,false);
 }catch(e){g.innerHTML=`<div class="note">No se pudo conectar con Wikimedia Commons. Verifique la conexión a internet. La anatomía rotulada funciona sin conexión.</div>`;}}

/* ---- Mis imágenes ---- */
async function misCorte(p){const c=$('#cont');let all=[];try{all=(await dbAll()).filter(x=>x.reg==p.id);}catch(e){}
 c.innerHTML=`<div class="note">Agregue capturas propias (ecógrafo, PACS, celular) de <b>${esc(p.n)}</b>. Se guardan solo en este equipo; puede rotularlas con los nombres de este corte.</div>
 <label class="more" style="display:inline-block">➕ Agregar imágenes<input type="file" id="fup" accept="image/*" multiple hidden></label><div class="gal" id="gal"></div>`;
 const est=rotulables(p).map(i=>p.s[i][0]);
 GAL=all.map(x=>({...x,src:x.data,th:x.data,est,mine:1}));
 $('#gal').innerHTML=GAL.length?GAL.map((i,k)=>`<div class="im" data-g="${k}"><img src="${i.data}" alt=""><span class="mk">${i.web?'GUARDADA':'PROPIA'}</span><div class="c">${esc(i.t)}</div></div>`).join(''):'<p style="color:var(--mu)">Aún no hay imágenes en este corte.</p>';
 $('#fup').onchange=async e=>{for(const f of e.target.files){const d=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f);});
  await dbPut({id:'p'+Date.now()+Math.random(),reg:p.id,t:f.name.replace(/\.[^.]+$/,''),data:d});}abrirCorte(p.id,'mis');};}
async function miAtlas(){cur=null;lista();let all=[];try{all=await dbAll();}catch(e){}
 $('#main').innerHTML=`<div class="ttl"><h2>⭐ Mi atlas</h2></div><p class="sub">${all.length} imágenes propias o guardadas. Para agregar, abra un corte y use “Mis imágenes”.</p>
 ${CORTES.filter(p=>all.some(x=>x.reg==p.id)).map(p=>`<h3 style="color:var(--az)">${esc(p.n)}</h3><div class="gal">${all.filter(x=>x.reg==p.id).map(x=>`<div class="im" data-goreg="${p.id}"><img src="${x.data}" alt=""><div class="c">${esc(x.t)}</div></div>`).join('')}</div>`).join('')||'<p>Todavía vacío.</p>'}`;}

/* ---- eventos ---- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-m],[data-id],[data-home],[data-mi],[data-tab],[data-g],[data-goreg],[data-seq],[data-modo],[data-quiz],[data-s]');if(!t)return;
 const p=CORTES.find(x=>x.id==cur);
 if(t.dataset.s!==undefined&&p){if(quiz)return;seleccionar(p,+t.dataset.s);}
 else if(t.dataset.seq){seq=t.dataset.seq;vistaAtlas(p);}
 else if(t.dataset.modo){modo=t.dataset.modo;quiz=null;LS.set('atlas-modo',modo);vistaAtlas(p);}
 else if(t.dataset.quiz){if(quiz){quiz=null;vistaAtlas(p);}else{const L=rotulables(p);quiz={ok:0,n:0,obj:L[Math.floor(Math.random()*L.length)]};sel=null;vistaAtlas(p);}}
 else if(t.dataset.g!==undefined)abrir(+t.dataset.g);
 else if(t.dataset.goreg)abrirCorte(t.dataset.goreg,'mis');
 else if(t.dataset.tab)abrirCorte(cur,t.dataset.tab);
 else if(t.dataset.mi)miAtlas();
 else if(t.dataset.m){mod=t.dataset.m;LS.set('atlas-mod',mod);navMods();home();}
 else if(t.dataset.id){abrirCorte(t.dataset.id,'atlas',t.dataset.sel);$('#side').classList.remove('open');}
 else if(t.dataset.home){home();$('#side').classList.remove('open');}
});
$('#q').oninput=()=>{lista();if(!cur)home();};
$('#q').onkeydown=e=>{if(e.key=='Enter'){cur=null;home();}};
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#tema').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';LS.set('atlas-tema',r.dataset.theme);const p=CORTES.find(x=>x.id==cur);if(p&&tab=='atlas')dibujar(p);};
{const t=LS.get('atlas-tema',null);if(t)document.documentElement.dataset.theme=t;modo=LS.get('atlas-modo',null);}
window.addEventListener('resize',()=>{if($('#vw').classList.contains('open'))fit();});
if(!MODS[mod])mod='US';
navMods();home();

/* ---------- Visor con zoom, ventana y rótulos ---------- */
let vi=0,S=1,X=0,Y=0,inv=false,rot=false,hide=false;
function key(i){return 'pins:'+(i.mine?i.id:i.src);}
function abrir(i){vi=i;const it=GAL[i];if(!it)return;$('#vw').classList.add('open');rot=false;$('#vlab').classList.remove('on');
 const img=$('#vimg');img.onload=fit;img.src=it.src;
 $('#vsave').style.display=it.mine?'none':'';
 $('#vfoot').innerHTML=it.mine?`<b>${esc(it.t)}</b> · imagen propia · <a href="#" id="vdel">Eliminar de Mi atlas</a>`:
  `<b>${esc(it.t)}</b>${it.desc?' — '+esc(it.desc):''}<br>Autor: ${esc(it.aut||'ver página')} · Licencia: ${esc(it.lic)} · <a href="${esc(it.page)}" target="_blank" rel="noopener">Ver en Wikimedia Commons</a>`;
 if(it.mine)$('#vdel').onclick=async e=>{e.preventDefault();if(confirm('¿Eliminar esta imagen de Mi atlas?')){await dbDel(it.id);cerrar();abrirCorte(cur,'mis');}};
 pins();}
function cerrar(){$('#vw').classList.remove('open');$('#vlist').classList.remove('on');}
function fit(){const st=$('#vst'),im=$('#vimg');S=Math.min(st.clientWidth/im.naturalWidth,st.clientHeight/im.naturalHeight);X=(st.clientWidth-im.naturalWidth*S)/2;Y=(st.clientHeight-im.naturalHeight*S)/2;tr();pins();}
function tr(){$('#vin').style.transform=`translate(${X}px,${Y}px) scale(${S})`;$('#vimg').style.filter=`brightness(${$('#vb').value}%) contrast(${$('#vc').value}%)${inv?' invert(1)':''}`;
 document.querySelectorAll('.pin').forEach(p=>p.style.transform=`translate(-50%,-50%) scale(${1/S})`);}
function zoom(f,cx,cy){const st=$('#vst').getBoundingClientRect();cx=cx??st.width/2;cy=cy??st.height/2;X=cx-(cx-X)*f;Y=cy-(cy-Y)*f;S*=f;tr();}
function pins(){const it=GAL[vi];const ps=LS.get(key(it),[]);const im=$('#vimg');
 document.querySelectorAll('.pin').forEach(p=>p.remove());
 if(!hide)ps.forEach((p,k)=>{const d=document.createElement('div');d.className='pin';d.style.left=p.x*im.naturalWidth+'px';d.style.top=p.y*im.naturalHeight+'px';d.innerHTML=`<i>${k+1}</i><span>${esc(p.n)}</span>`;$('#vin').appendChild(d);});
 $('#vlist').innerHTML='<b>Rótulos</b>'+(ps.length?ps.map((p,k)=>`<div><span>${k+1}. ${esc(p.n)}</span><button data-dp="${k}">✕</button></div>`).join(''):'<p>Sin rótulos. Use 📍 Rotular y toque la imagen.</p>');
 tr();}
let drag=null,moved=false;
$('#vst').addEventListener('pointerdown',e=>{if(e.target.closest('#vlist'))return;drag={x:e.clientX,y:e.clientY,X,Y};moved=false;$('#vst').setPointerCapture(e.pointerId);});
$('#vst').addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){X=drag.X+dx;Y=drag.Y+dy;tr();}});
$('#vst').addEventListener('pointerup',e=>{const was=drag;drag=null;if(!was||moved||!rot||e.target.closest('#vlist'))return;
 const r=$('#vst').getBoundingClientRect(),im=$('#vimg');const x=(e.clientX-r.left-X)/S/im.naturalWidth,y=(e.clientY-r.top-Y)/S/im.naturalHeight;if(x<0||y<0||x>1||y>1)return;
 const n=prompt('Nombre de la estructura anatómica:\n('+(GAL[vi].est||[]).slice(0,14).join(', ')+')');if(!n)return;
 const it=GAL[vi],ps=LS.get(key(it),[]);ps.push({x,y,n});LS.set(key(it),ps);pins();});
$('#vst').addEventListener('wheel',e=>{e.preventDefault();const r=$('#vst').getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
$('#vlist').addEventListener('click',e=>{const b=e.target.closest('[data-dp]');if(!b)return;const it=GAL[vi],ps=LS.get(key(it),[]);ps.splice(+b.dataset.dp,1);LS.set(key(it),ps);pins();});
$('#vx').onclick=cerrar;$('#vzi').onclick=()=>zoom(1.25);$('#vzo').onclick=()=>zoom(.8);$('#vfit').onclick=fit;
$('#vprev').onclick=()=>abrir((vi-1+GAL.length)%GAL.length);$('#vnext').onclick=()=>abrir((vi+1)%GAL.length);
$('#vb').oninput=tr;$('#vc').oninput=tr;$('#vinv').onclick=e=>{inv=!inv;e.target.classList.toggle('on',inv);tr();};
$('#vlab').onclick=e=>{rot=!rot;e.target.classList.toggle('on',rot);$('#vst').style.cursor=rot?'crosshair':'grab';};
$('#vls').onclick=e=>{$('#vlist').classList.toggle('on');e.target.classList.toggle('on');};
$('#vhide').onclick=e=>{hide=!hide;e.target.classList.toggle('on',hide);pins();};
$('#vsave').onclick=async()=>{const it=GAL[vi];try{const b=await (await fetch(it.src)).blob();const d=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b);});
 const id='w'+Date.now();await dbPut({id,reg:it.reg,t:it.t,data:d,web:1,page:it.page,lic:it.lic,aut:it.aut});LS.set('pins:'+id,LS.get(key(it),[]));alert('Guardada en Mi atlas (disponible sin internet).');}catch(e){alert('No se pudo guardar: '+e.message);}};
document.addEventListener('keydown',e=>{if(!$('#vw').classList.contains('open'))return;if(e.key=='Escape')cerrar();if(e.key=='ArrowRight')$('#vnext').click();if(e.key=='ArrowLeft')$('#vprev').click();});


</script>
