<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas Radiológico</title>
<style>
:root{--az:#123A78;--azc:#EAF1FA;--gr:#F4F7FB;--do:#C9A227;--ro:#C00028;--tx:#222B38;--bg:#ffffff;--pn:#ffffff;--bd:#d6dfeb;--mu:#5b6778;--us:#0e7c86;--tc:#7a4a00;--rm:#5b2a86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--az:#7fb0ff;--azc:#16243a;--gr:#1a2230;--tx:#e6ebf2;--bg:#0f141c;--pn:#151c27;--bd:#2a3546;--mu:#9aa6b8;--ro:#ff6b81;--us:#4fd1d9;--tc:#f0b45a;--rm:#c39bff}}
:root[data-theme="dark"]{--az:#7fb0ff;--azc:#16243a;--gr:#1a2230;--tx:#e6ebf2;--bg:#0f141c;--pn:#151c27;--bd:#2a3546;--mu:#9aa6b8;--ro:#ff6b81;--us:#4fd1d9;--tc:#f0b45a;--rm:#c39bff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#123A78;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:3px solid #C9A227;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;min-width:180px}
header small{display:block;font-weight:normal;opacity:.8;font-size:11px}
#q{flex:2;min-width:180px;padding:8px 10px;border-radius:6px;border:0;font-size:14px}
#tema{background:transparent;color:#fff;border:1px solid #fff6;border-radius:6px;padding:7px 10px;cursor:pointer}
nav.mods{display:flex;gap:6px;padding:10px 16px;background:var(--azc);border-bottom:1px solid var(--bd);overflow-x:auto}
nav.mods button{border:1px solid var(--bd);background:var(--pn);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:bold;white-space:nowrap}
nav.mods button.on{background:var(--az);color:var(--bg);border-color:var(--az)}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 110px)}
aside{border-right:1px solid var(--bd);background:var(--pn);overflow-y:auto;max-height:calc(100vh - 110px);position:sticky;top:110px}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 14px 4px}
aside a{display:block;padding:8px 14px;color:var(--tx);text-decoration:none;border-left:3px solid transparent;font-size:14px;cursor:pointer}
aside a:hover{background:var(--gr)}
aside a.on{border-left-color:var(--do);background:var(--azc);font-weight:bold}
.tag{font-size:10px;font-weight:bold;padding:2px 6px;border-radius:4px;margin-left:6px;color:#fff;vertical-align:middle}
.t-US{background:var(--us)}.t-TC{background:var(--tc)}.t-RM{background:var(--rm)}
main{padding:20px 24px;max-width:1100px}
.ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl h2{margin:0;color:var(--az);font-size:22px}
.sub{color:var(--mu);margin:4px 0 16px}
.grid{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:start}
.fig{background:#0b0f14;border-radius:10px;padding:10px;border:1px solid var(--bd)}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{color:#b8c4d6;font-size:12px;margin-top:6px;text-align:center}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.leg span{font-size:12px;background:var(--gr);border:1px solid var(--bd);padding:3px 8px;border-radius:12px;cursor:pointer}
.leg span.hl{background:var(--do);color:#000}
section.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;overflow:hidden}
section.card h4{margin:0;background:var(--az);color:var(--bg);padding:8px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
section.card .bd{padding:10px 14px;font-size:14px;line-height:1.5}
section.card ul{margin:0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--azc);text-align:left;padding:6px 8px;color:var(--az)}
td{padding:6px 8px;border-top:1px solid var(--bd)}
tr:nth-child(even) td{background:var(--gr)}
.pat li b{color:var(--ro)}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px;cursor:pointer}
.tile:hover{border-color:var(--do)}
.tile b{color:var(--az)}
.tile p{margin:6px 0 0;font-size:13px;color:var(--mu)}
.quiz{margin-top:6px}
.quiz button{margin:4px 4px 0 0;padding:6px 10px;border:1px solid var(--bd);background:var(--gr);color:var(--tx);border-radius:6px;cursor:pointer}
.quiz .ok{background:#1f8a4c;color:#fff}.quiz .no{background:var(--ro);color:#fff}
#menu{display:none;background:transparent;color:#fff;border:1px solid #fff6;border-radius:6px;padding:7px 10px}
svg text{font-family:Arial;font-size:11px;fill:#e8eef7}
svg .lbl{pointer-events:none}
svg .s{transition:all .2s}
svg .s.hl{stroke:#C9A227!important;stroke-width:3!important;filter:drop-shadow(0 0 4px #C9A227)}
@media (max-width:820px){
 .wrap{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;bottom:0;width:80%;max-width:300px;max-height:none;z-index:10;transform:translateX(-100%);transition:.2s;box-shadow:0 0 20px #0008}
 aside.open{transform:none}
 #menu{display:block}
 .grid{grid-template-columns:1fr}
 main{padding:16px}
}
@media print{header,nav,aside{display:none}.wrap{display:block}}
</style>
</head>

/* ===================== APP ===================== */
const MODS={TODO:'Todos',US:'Ecografía',TC:'Tomografía',RM:'Resonancia'};
let mod='TODO', cur=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function navMods(){$('#mods').innerHTML=Object.entries(MODS).map(([k,v])=>`<button class="${k==mod?'on':''}" data-m="${k}">${v}</button>`).join('')+`<button data-quiz="1">🎯 Autoevaluación</button>`;}
function lista(){
 const q=$('#q').value.trim().toLowerCase();
 const it=A.filter(a=>(mod=='TODO'||a.m==mod)&&(!q||JSON.stringify(a).toLowerCase().includes(q)));
 const grp={};it.forEach(a=>(grp[a.r]=grp[a.r]||[]).push(a));
 $('#side').innerHTML=`<a data-home="1">🏠 Inicio</a>`+(Object.keys(grp).length?Object.entries(grp).map(([r,xs])=>`<h3>${r}</h3>`+xs.map(a=>`<a data-id="${a.id}" class="${cur==a.id?'on':''}">${a.n}<span class="tag t-${a.m}">${a.m}</span></a>`).join('')).join(''):'<p style="padding:14px;color:var(--mu)">Sin resultados.</p>');
 return it;
}
function home(){
 cur=null;const it=lista();
 $('#main').innerHTML=`<div class="ttl"><h2>${MODS[mod]}</h2></div><p class="sub">${it.length} fichas · anatomía esquemática interactiva, técnica, valores de referencia, patología y clasificaciones.</p>
 <div class="home">${it.map(a=>`<div class="tile" data-id="${a.id}"><span class="tag t-${a.m}" style="margin:0">${a.m}</span> <b>${a.n}</b><p>${a.r} · ${a.val.length} valores · ${a.pat.length} patologías</p></div>`).join('')}</div>`;
}
function ficha(id){
 const a=A.find(x=>x.id==id);if(!a)return home();cur=id;lista();
 const ks=[...new Set((F[a.f].match(/data-k="([^"]+)"/g)||[]).map(s=>s.slice(8,-1)))];
 $('#main').innerHTML=`<div class="ttl"><span class="tag t-${a.m}" style="margin:0">${MODS[a.m]}</span><h2>${a.n}</h2></div><p class="sub">${a.r}</p>
 <div class="grid"><div><div class="fig" id="fig">${F[a.f]}<div class="cap">Esquema didáctico (no a escala). Toque una estructura.</div></div>
 <div class="leg">${ks.map(k=>`<span data-k="${esc(k)}">${esc(k)}</span>`).join('')}</div></div>
 <div>
 <section class="card"><h4>Técnica</h4><div class="bd">${a.tec}</div></section>
 <section class="card"><h4>Anatomía / semiología normal</h4><div class="bd"><ul>${a.anat.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>
 </div></div>
 <section class="card"><h4>Valores de referencia</h4><div class="bd" style="padding:0"><table><tr><th>Parámetro</th><th>Valor</th></tr>${a.val.map(v=>`<tr><td>${v[0]}</td><td><b>${v[1]}</b></td></tr>`).join('')}</table></div></section>
 <section class="card"><h4>Patología frecuente — signos clave</h4><div class="bd"><ul class="pat">${a.pat.map(p=>`<li><b>${p[0]}.</b> ${p[1]}</li>`).join('')}</ul></div></section>
 <section class="card"><h4>Clasificaciones</h4><div class="bd">${a.cls}</div></section>`;
 window.scrollTo(0,0);
}
function hl(k){document.querySelectorAll('#fig .s').forEach(e=>e.classList.toggle('hl',e.dataset.k==k));document.querySelectorAll('.leg span').forEach(e=>e.classList.toggle('hl',e.dataset.k==k));}
function quiz(){
 cur=null;lista();
 const pool=A.flatMap(a=>a.val.map(v=>({q:v[0]+' ('+a.n+')',r:v[1]})));
 const p=pool[Math.floor(Math.random()*pool.length)];
 const ops=[p.r,...pool.filter(x=>x.r!=p.r).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.r)].sort(()=>Math.random()-.5);
 $('#main').innerHTML=`<div class="ttl"><h2>🎯 Autoevaluación</h2></div><p class="sub">Elija el valor de referencia correcto.</p>
 <section class="card"><h4>${esc(p.q)}</h4><div class="bd quiz">${ops.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}<p><button id="sig">Siguiente ›</button></p></div></section>`;
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-o]').forEach(x=>{if(x.textContent==p.r)x.classList.add('ok')});if(b.textContent!=p.r)b.classList.add('no');});
 $('#sig').onclick=quiz;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-m],[data-id],[data-home],[data-k],[data-quiz]');if(!t)return;
 if(t.dataset.quiz){quiz();}
 else if(t.dataset.m){mod=t.dataset.m;navMods();home();}
 else if(t.dataset.id){ficha(t.dataset.id);$('#side').classList.remove('open');}
 else if(t.dataset.home){home();$('#side').classList.remove('open');}
 else if(t.dataset.k){hl(t.dataset.k);}
});
$('#q').oninput=()=>{const it=lista();if(!cur)home();};
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#tema').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';try{localStorage.setItem('atlas-tema',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('atlas-tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
navMods();home();
</script>
