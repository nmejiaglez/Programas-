name: Mi Ciudad - APK y PC

on:
  push:
    paths:
      - "MiCiudad/**"
      - ".github/workflows/mi-ciudad.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MiCiudad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: node build.js
      - name: Crear proyecto Android
        run: |
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MiCiudad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiCiudad-apk
          path: MiCiudad/MiCiudad.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Armar el juego
        working-directory: MiCiudad
        run: |
          npm install three@0.128.0 --no-save --no-audit --no-fund
          node build.js
      - name: Compilar programa para Windows
        working-directory: MiCiudad/desktop
        shell: bash
        run: |
          cp -r ../www app
          npm install --no-audit --no-fund
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MiCiudad-pc
          path: MiCiudad/desktop/dist/MiCiudad-PC.exe

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mi-ciudad-prueba
          name: Mi Ciudad (versión de prueba)
          prerelease: true
          body: |
            Mi Ciudad, versión de prueba.
            - MiCiudad.apk: para teléfonos Android (permita "instalar apps desconocidas").
            - MiCiudad-PC.exe: para computadoras con Windows (doble clic para jugar; si Windows avisa, toque "Más información" y "Ejecutar de todas formas").
          files: |
            out/MiCiudad-apk/MiCiudad.apk
            out/MiCiudad-pc/MiCiudad-PC.exe
