name: Mi Hospital Tycoon - APK

on:
  push:
    paths:
      - "HospitalTycoon/**"
      - ".github/workflows/hospital-tycoon-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HospitalTycoon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Armar el juego
        run: node build.js
      - name: Crear proyecto Android
        run: |
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MiHospitalTycoon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiHospitalTycoon-apk
          path: HospitalTycoon/MiHospitalTycoon.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hospital-tycoon-prueba
          name: Mi Hospital Tycoon (versión de prueba)
          prerelease: true
          body: APK de prueba de Mi Hospital Tycoon. Descárguelo en el teléfono Android e instálelo (permita "instalar apps desconocidas").
          files: HospitalTycoon/MiHospitalTycoon.apk
