<style>
/* Layout: lienzo 3D a pantalla completa; HUD flotante arriba, controles táctiles abajo, hojas deslizantes para tienda y minijuegos */
:root{
  --ink:#14304A;
  --muted:#5E7489;
  --panel:#FFFFFF;
  --soft:#EEF4F8;
  --line:#D5E2EA;
  --accent:#2E7BEF;
  --accent-d:#1D58B8;
  --go:#19A858;
  --go-d:#0F7B3E;
  --coin:#F5B21B;
  --coin-d:#B57B00;
  --danger:#E2465C;
  --sky:#9FD8F5;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 12px 5px 6px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(20,48,74,.18);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.cash .ico{background:#D8F5E3}
.mcp{border:2px solid var(--coin);padding-right:6px}
.mcp .plus{width:24px;height:24px;border-radius:50%;background:var(--coin);color:#3B2600;line-height:24px;text-align:center;font-size:17px}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE38E,var(--coin) 55%,var(--coin-d));box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);position:relative;flex:none;vertical-align:-5px}
.coin::after{content:"M";position:absolute;inset:0;text-align:center;font:800 12px/22px var(--body);color:#fff}
.coin.sm{width:16px;height:16px;vertical-align:-3px}
.coin.sm::after{font-size:9px;line-height:16px}
.spacer{flex:1}
.tbtns{display:flex;flex-direction:column;gap:8px}
.tb{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 3px 0 rgba(20,48,74,.18);font-size:22px;display:grid;place-items:center;position:relative}
.tb small{position:absolute;bottom:-1px;left:0;right:0;font-size:9.5px;font-weight:800;color:var(--muted)}
.tb .e{margin-top:-8px}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--danger);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;z-index:5;box-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ctrl{position:fixed;z-index:5}
#jump{right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(20,48,74,.25);font-weight:800;font-size:13px;display:grid;place-items:center;line-height:1.05}
#jump .e{font-size:26px;display:block}
#ride{right:calc(max(16px,env(safe-area-inset-right,0px)) + 96px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(20,48,74,.25);font-size:26px}
#ride[aria-pressed="true"]{background:var(--coin)}
#act{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);background:var(--go);color:#fff;font-family:var(--display);font-weight:800;font-size:19px;padding:10px 22px;border-radius:999px;box-shadow:0 5px 0 var(--go-d);white-space:nowrap;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.75);z-index:4;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 3px 6px rgba(0,0,0,.2)}
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(20,48,74,.72);color:#fff;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:10px;z-index:4;max-width:60%;line-height:1.4}
.joyhint{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:96px;height:96px;border-radius:50%;border:3px dashed rgba(255,255,255,.8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.4);z-index:3;pointer-events:none}

/* Hojas */
.sheetwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,25,40,.45)}
.sheetwrap.clear{background:transparent;pointer-events:none}
.sheetwrap.clear .sheet{pointer-events:auto}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.half{max-height:56%}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:2px solid var(--soft)}
.sh-h h2{flex:1;margin:0;font-family:var(--display);font-size:22px;line-height:1.1;font-weight:800;text-wrap:balance}
.x{width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:18px;font-weight:800}
.sh-b{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sh-b p{margin:0;line-height:1.45}
.muted{color:var(--muted);font-size:13.5px}
h3{margin:4px 0 0;font-family:var(--display);font-size:18px;line-height:1.1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:999px;background:var(--soft);border:2px solid var(--line);font-weight:800;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.card{background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.card .big{font-size:34px;line-height:1.1}
.card b{font-size:13.5px;line-height:1.15}
.card small{font-size:11.5px;color:var(--muted);line-height:1.2}
.card.on{border-color:var(--go);background:#E6F8EE}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.btn{width:100%;padding:9px 8px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--accent-d);line-height:1.15;font-variant-numeric:tabular-nums}
.btn:disabled{background:#B8C6D1;box-shadow:0 3px 0 #9AAAB6;cursor:default}
.btn.go{background:var(--go);box-shadow:0 3px 0 var(--go-d)}
.btn.coinb{background:var(--coin);box-shadow:0 3px 0 var(--coin-d);color:#3B2600}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.red{background:var(--danger);box-shadow:0 3px 0 #A32D40}
.btn.big{font-family:var(--display);font-size:20px;padding:12px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{border:2px solid var(--coin);background:#FFF8E5;border-radius:16px;padding:14px 8px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;position:relative}
.pack .amt{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.pack .tag{position:absolute;top:-10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.45}
input[type=text],input[type=password],input[type=number]{font:inherit;font-weight:800;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
input:focus{outline:none;border-color:var(--accent)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:22px;letter-spacing:1px;background:#FFF8E5;border:2px dashed var(--coin);border-radius:12px;padding:12px;text-align:center;user-select:text;-webkit-user-select:text;word-break:break-all}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:8px 10px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px}
.li .tx small{color:var(--muted);font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;user-select:text;-webkit-user-select:text}

/* Minijuegos */
.mg-top{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:12px;padding:8px 12px}
.patient{display:flex;align-items:center;gap:14px;background:#EAF7FF;border-radius:16px;padding:14px}
.patient .pe{font-size:56px;line-height:1}
.bubble{background:#fff;border-radius:14px;padding:10px 12px;font-weight:800;font-size:16px;position:relative;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:800;font-size:15.5px;text-align:left}
.opt.ok{background:#DDF6E7;border-color:var(--go)}
.opt.bad{background:#FDE3E7;border-color:var(--danger)}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prod{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:8px 2px;font-size:34px;line-height:1}
.prod small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:4px}
.prod.got{opacity:.3}
.prod.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.order{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF8E5;border-radius:14px;padding:10px 12px;font-weight:800}
.order .it{font-size:30px}
.order .it.got{opacity:.3}
.flv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.flv button{aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line),0 4px 0 rgba(0,0,0,.12)}
.flvn{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:11px;font-weight:800;color:var(--muted);margin-top:-6px}
.cone{display:flex;flex-direction:column-reverse;align-items:center;min-height:150px;justify-content:flex-start}
.cone .c{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:70px solid #D79A4E}
.cone .s{width:66px;height:46px;border-radius:50% 50% 40% 40%;margin-bottom:-14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.wantrow{display:flex;gap:6px;align-items:center}
.wantrow .dotf{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
#pop{width:100%;height:320px;border-radius:16px;background:linear-gradient(#2C1F5E,#5B3FA8);touch-action:none;display:block}
.res{font-family:var(--display);font-size:24px;font-weight:800;text-align:center;line-height:1.15}
.house{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:linear-gradient(#FFF3DE 60%,#E7C9A0 60%);border-radius:16px;padding:14px;min-height:120px;font-size:34px;text-align:center;align-content:start}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 100px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:40}
.toast{background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;animation:tin .25s ease-out;max-width:90%;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);z-index:60;font-family:var(--display);font-size:28px;font-weight:800;color:var(--ink);text-align:center}
#loading small{display:block;font-family:var(--body);font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#act{animation:none}.toast{animation:none}}
</style>

const matCache={};
function M(c,em){const k=c+"|"+(em||"");if(!matCache[k])matCache[k]=new T.MeshLambertMaterial({color:c,emissive:em||0x000000});return matCache[k];}
function mesh(geo,c,x,y,z,parent,em){const m=new T.Mesh(geo,M(c,em));m.position.set(x||0,y||0,z||0);(parent||scene).add(m);return m;}
function box(w,h,d,c,x,y,z,p,em){return mesh(new T.BoxGeometry(w,h,d),c,x,y,z,p,em);}
function cyl(rt,rb,h,c,x,y,z,p,seg){return mesh(new T.CylinderGeometry(rt,rb,h,seg||14),c,x,y,z,p);}
function sph(r,c,x,y,z,p,ws,hs){return mesh(new T.SphereGeometry(r,ws||14,hs||10),c,x,y,z,p);}
function cone(r,h,c,x,y,z,p,seg){return mesh(new T.ConeGeometry(r,h,seg||14),c,x,y,z,p);}

const colliders=[];
function addCol(cx,cz,w,d,h){colliders.push({a:cx-w/2,b:cx+w/2,c:cz-d/2,d:cz+d/2,h:h||0});}
function blocked(x,z,r){if(Math.abs(x)>96||Math.abs(z)>96)return true;for(const k of colliders){if(x>k.a-r&&x<k.b+r&&z>k.c-r&&z<k.d+r)return true;}return false;}

function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new T.CanvasTexture(c);t.anisotropy=4;return t;}
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();}
function signTex(text,bg){return canvasTex(512,128,(x,w,h)=>{x.fillStyle=bg;rr(x,0,0,w,h,26);x.fill();x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=8;rr(x,6,6,w-12,h-12,22);x.stroke();x.fillStyle="#fff";let fs=62;x.font="800 "+fs+"px 'Baloo 2', Nunito, Arial, sans-serif";while(x.measureText(text).width>w-50&&fs>30){fs-=4;x.font="800 "+fs+"px 'Baloo 2', Nunito, Arial, sans-serif";}x.textAlign="center";x.textBaseline="middle";x.fillText(text,w/2,h/2+4);});}
function labelSprite(text,bg,fg){const tex=canvasTex(256,64,(x,w,h)=>{x.font="800 30px Nunito, Arial, sans-serif";const tw=Math.min(w-8,x.measureText(text).width+28);x.fillStyle=bg;rr(x,(w-tw)/2,8,tw,48,22);x.fill();x.fillStyle=fg;x.textAlign="center";x.textBaseline="middle";x.fillText(text,w/2,33);});const s=new T.Sprite(new T.SpriteMaterial({map:tex,depthTest:false,transparent:true}));s.scale.set(3.2,0.8,1);s.renderOrder=10;return s;}

addEventListener("keyup",e=>{keys[e.code]=false;});
canvas.addEventListener("pointerdown",e=>{if(uiOpen)return;canvas.setPointerCapture(e.pointerId);
 if(e.pointerType==="touch"&&e.clientX<innerWidth*0.45&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=0;joy.y=0;const j=$("joy");j.style.left=e.clientX+"px";j.style.top=e.clientY+"px";j.hidden=false;$("knob").style.transform="";$("joyhint").hidden=true;}
 else if(drag.id===null){drag.id=e.pointerId;drag.x=e.clientX;drag.y=e.clientY;}});
canvas.addEventListener("pointermove",e=>{
 if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m;}joy.x=dx/m;joy.y=dy/m;$("knob").style.transform="translate("+dx+"px,"+dy+"px)";}
 else if(e.pointerId===drag.id){camYaw-=(e.clientX-drag.x)*0.008;camPitch=Math.max(0.12,Math.min(1.15,camPitch+(e.clientY-drag.y)*0.005));drag.x=e.clientX;drag.y=e.clientY;}});
function endPtr(e){if(e.pointerId===joy.id){joy.id=null;joy.x=0;joy.y=0;$("joy").hidden=true;}if(e.pointerId===drag.id)drag.id=null;}

let nearDoor=null;let perf=0;
function updatePlayer(dt){
 let mx=0,mz=0;
 if(!uiOpen){
  if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
  if(joy.id!==null){mx+=joy.x;mz+=joy.y;}
 }
 const ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml;}
 const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
 const vx=rx*mx+fx*(-mz),vz=rz*mx+fz*(-mz);
 const veh=S.riding&&S.vehicle?VEHICLES.find(v=>v.id===S.vehicle):null;
 const maxS=7*(veh?veh.speed:1);
 const amt=Math.min(1,Math.hypot(vx,vz));
 P.speed=amt*maxS;
 if(amt>0.05){const nx=P.x+vx*maxS*dt,nz=P.z+vz*maxS*dt;const r=veh&&veh.speed>2.2?1.2:0.6;
  if(!blocked(nx,P.z,r))P.x=nx;if(!blocked(P.x,nz,r))P.z=nz;
  const target=Math.atan2(vx,vz);let d=target-P.face;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;P.face+=d*Math.min(1,dt*12);}
 P.vy-=22*dt;P.y+=P.vy*dt;if(P.y<=0.3){P.y=0.3;P.vy=0;P.ground=true;}
 player.g.position.set(P.x,P.y,P.z);player.g.rotation.y=P.face;
 if(vehicleObj){player.body.position.y=vehicleObj.lift;player.legs.forEach(l=>{l.visible=!vehicleObj.sit;l.rotation.x=0;});player.arms.forEach(a=>a.rotation.x=-0.9);player.shadow.scale.setScalar(1.6);}
 else{player.legs.forEach(l=>l.visible=true);player.shadow.scale.setScalar(1);animChar(player,P.speed,dt,!P.ground);}
 if(petObj){const tx=P.x-Math.sin(P.face)*1.8+Math.cos(P.face)*1.2,tz=P.z-Math.cos(P.face)*1.8-Math.sin(P.face)*1.2;const k=Math.min(1,dt*(veh?6:3.5));const ox=petPos.x,oz=petPos.z;petPos.x+=(tx-petPos.x)*k;petPos.z+=(tz-petPos.z)*k;const mv=Math.hypot(petPos.x-ox,petPos.z-oz);
  petObj.position.set(petPos.x,0.3+(mv>0.01?Math.abs(Math.sin(perf*12))*0.25:0)+(S.pet==="dragon"?1.2+Math.sin(perf*3)*0.2:0),petPos.z);if(mv>0.005)petObj.rotation.y=Math.atan2(petPos.x-ox,petPos.z-oz);}
 nearDoor=null;let bd=4.2;for(const d of doors){const dd=Math.hypot(d.x-P.x,d.z-P.z);if(dd<bd){bd=dd;nearDoor=d;}}
 const act=$("act");if(nearDoor&&!uiOpen){act.hidden=false;const t=nearDoor.b.icon+" Entrar: "+nearDoor.b.name;if(act.textContent!==t)act.textContent=t;}else act.hidden=true;
}
function updateCamera(dt){
 const tx=P.x,ty=P.y+1.9,tz=P.z;
 let dist=camDist;
 for(let k=1;k<=12;k++){const t=camDist*k/12;const px=tx+Math.sin(camYaw)*Math.cos(camPitch)*t,py=ty+Math.sin(camPitch)*t,pz=tz+Math.cos(camYaw)*Math.cos(camPitch)*t;
  if(colliders.some(c=>c.h&&py<c.h&&px>c.a-0.5&&px<c.b+0.5&&pz>c.c-0.5&&pz<c.d+0.5)){dist=Math.max(2.5,t-camDist/12);break;}}
 const cx=tx+Math.sin(camYaw)*Math.cos(camPitch)*dist,cy=ty+Math.sin(camPitch)*dist,cz=tz+Math.cos(camYaw)*Math.cos(camPitch)*dist;
 const k=Math.min(1,dt*8);camera.position.x+=(cx-camera.position.x)*k;camera.position.y+=(cy-camera.position.y)*k;camera.position.z+=(cz-camera.position.z)*k;
 camera.lookAt(tx,ty,tz);
}

/* ---------- Códigos ---------- */
const B32="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function h32(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function enc(n,len){let s="";for(let i=0;i<len;i++){s+=B32[n%32];n=Math.floor(n/32);}return s;}
function makeCode(amount){const r=enc(Math.floor(Math.random()*1048576),4);return "MC-"+amount+"-"+r+"-"+enc(h32(SALT+amount+r),4);}
function checkCode(c){const m=/^MC-(\d{1,6})-([A-Z2-9]{4})-([A-Z2-9]{4})$/.exec((c||"").toUpperCase().replace(/\s/g,""));if(!m)return 0;if(enc(h32(SALT+m[1]+m[2]),4)!==m[3])return 0;return +m[1];}
function redeem(v){const code=(v||"").toUpperCase().replace(/\s/g,"");const amt=checkCode(code);
 if(!amt){toast("❌ Código no válido. Revise que esté bien escrito.");return;}
 if(S.used[code]){toast("Ese código ya fue usado.");return;}
 S.used[code]=Date.now();S.mc+=amt;save();hud();
 sheet("¡Código canjeado!",b=>{b.appendChild(el("div","res","🎉<br><span class='coin'></span> +"+amt.toLocaleString("es")+" MediCoins"));const k=el("button","btn go big","¡Genial!");k.onclick=closeSheet;b.appendChild(k);},{half:true});}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function intro(title,icon,desc,start){sheet(title,b=>{b.appendChild(el("div","res",'<div style="font-size:56px">'+icon+'</div>'));b.appendChild(el("p","",desc));if(payMult()>1)b.appendChild(el("p","muted","Bono activo: ganancias x"+payMult().toFixed(2).replace(/\.00$/,"")));const s=el("button","btn go big","Empezar");s.onclick=start;b.appendChild(s);});}

function gameHospital(){intro("Hospital","🏥","Atienda 6 pacientes. Escuche qué les pasa y elija el tratamiento correcto antes de que se acabe el tiempo.",()=>{
 const list=shuffle(CASES).slice(0,6);let i=0,ok=0,tot=0,timer=null,tl=0;
 sheet("Consulta",body=>{
  const top=el("div","mg-top");const pt=el("div","patient");const opts=el("div","opts");body.append(top,pt,opts);
  function next(){clearInterval(timer);if(i>=list.length){finish("Turno terminado","🩺<br>Atendió bien a "+ok+" de "+list.length+"<br>+$ "+tot);return;}
   const c=list[i];tl=10;pt.innerHTML='<div class="pe">'+c.p+'</div><div class="bubble">“'+c.t+'”</div>';
   const others=shuffle(CASES.filter(x=>x.ok!==c.ok)).slice(0,2).map(x=>x.ok);opts.innerHTML="";
   shuffle([c.ok,...others]).forEach(o=>{const b=el("button","opt",o);b.onclick=()=>{clearInterval(timer);opts.querySelectorAll("button").forEach(x=>x.disabled=true);if(o===c.ok){b.classList.add("ok");ok++;tot+=earn(40);}else{b.classList.add("bad");opts.querySelectorAll("button").forEach(x=>{if(x.textContent===c.ok)x.classList.add("ok");});}i++;setTimeout(next,850);};opts.appendChild(b);});
   draw();timer=setInterval(()=>{tl--;draw();if(tl<=0){clearInterval(timer);i++;toast("⏰ ¡El paciente se fue!");next();}},1000);}
  function draw(){top.innerHTML="<span>Paciente "+(i+1)+" de "+list.length+"</span><span>⏱ "+tl+" s</span>";}
  next();
 },{noClose:false,onClose:()=>clearInterval(timer)});
});}

function gameSuper(){intro("Supermercado","🛒","Usted es el cajero. Busque en el estante los productos de la lista de cada cliente. ¡Rápido, la fila espera!",()=>{
 let cust=0,timer=null,time=45,tot=0,order=[],got=[];
 sheet("Caja registradora",body=>{
  const top=el("div","mg-top");const ord=el("div","order");const gr=el("div","shop-grid");body.append(top,ord,gr);
  function newOrder(){order=shuffle(PRODUCTS).slice(0,3+Math.min(2,cust));got=[];renderOrder();gr.innerHTML="";
   shuffle(PRODUCTS).forEach(p=>{const b=el("button","prod",p[0]+"<small>"+p[1]+"</small>");b.onclick=()=>{const k=order.findIndex((o,ix)=>o[0]===p[0]&&!got.includes(ix));if(k>=0){got.push(k);b.classList.add("got");tot+=earn(12);renderOrder();if(got.length===order.length){cust++;tot+=earn(30);toast("🧾 ¡Cliente atendido!");setTimeout(newOrder,400);}}else{time=Math.max(0,time-2);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");}};gr.appendChild(b);});}
  function renderOrder(){ord.innerHTML="<span>Cliente "+(cust+1)+" quiere:</span>"+order.map((o,ix)=>'<span class="it'+(got.includes(ix)?" got":"")+'">'+o[0]+"</span>").join("");}
  function draw(){top.innerHTML="<span>Clientes: "+cust+"</span><span>⏱ "+time+" s</span>";}
  newOrder();draw();timer=setInterval(()=>{time--;draw();if(time<=0){clearInterval(timer);finish("¡Cerró la caja!","🛒<br>Atendió "+cust+" clientes<br>+$ "+tot);}},1000);
 },{onClose:()=>clearInterval(timer)});
});}

function gameHelados(){intro("Heladería","🍦","Prepare 5 helados. Toque los sabores en el orden del pedido, de abajo hacia arriba.",()=>{
 let n=0,tot=0,good=0,want=[],have=[];
 sheet("Heladería",body=>{
  const top=el("div","mg-top");const ordW=el("div","order");const cone=el("div","cone");const fl=el("div","flv");const fn=el("div","flvn");body.append(top,ordW,cone,fl,fn);
  FLAVORS.forEach((f,i)=>{const b=el("button","");b.style.background=f.c;b.setAttribute("aria-label",f.n);b.onclick=()=>add(i);fl.appendChild(b);fn.appendChild(el("span","",f.n));});
  function newOrder(){want=Array.from({length:1+Math.floor(Math.random()*3)},()=>Math.floor(Math.random()*FLAVORS.length));have=[];render();}
  function render(){top.innerHTML="<span>Pedido "+(n+1)+" de 5</span><span>Bien: "+good+"</span>";
   ordW.innerHTML='<span>Pedido:</span><span class="wantrow">'+want.map(i=>'<span class="dotf" style="background:'+FLAVORS[i].c+'"></span>').join("")+'</span><span class="muted">'+want.map(i=>FLAVORS[i].n).join(" + ")+"</span>";
   cone.innerHTML='<div class="c"></div>'+have.map(i=>'<div class="s" style="background:'+FLAVORS[i].c+'"></div>').join("");}
  function add(i){if(have.length>=want.length)return;have.push(i);render();
   if(have[have.length-1]!==want[have.length-1]){toast("😬 ¡Ese no era el sabor!");next(false);return;}
   if(have.length===want.length){tot+=earn(30+want.length*10);good++;toast("🍦 ¡Delicioso!");next(true);}}
  function next(){n++;setTimeout(()=>{if(n>=5){finish("¡Cerró la heladería!","🍦<br>Helados perfectos: "+good+" de 5<br>+$ "+tot);}else newOrder();},600);}
  newOrder();
 });
});}

function gameCine(){intro("Cine","🎬","Mueva la cubeta para atrapar las palomitas 🍿. Las estrellas ⭐ valen más. ¡Cuidado con las cebollas 🧅!",()=>{
 let raf=null,iv=null;
 sheet("Palomitas del cine",body=>{
  const top=el("div","mg-top");const cv=el("canvas");cv.id="pop";body.append(top,cv);
  const W=cv.clientWidth||340,H=320;const dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  let bx=W/2,score=0,time=25,items=[],spawn=0,last=performance.now();
  const mv=e=>{const r=cv.getBoundingClientRect();bx=Math.max(30,Math.min(W-30,e.clientX-r.left));};
  cv.addEventListener("pointermove",mv);cv.addEventListener("pointerdown",mv);
  function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;spawn-=dt;
   if(spawn<=0){spawn=0.35+Math.random()*0.3;const r=Math.random();items.push({x:20+Math.random()*(W-40),y:-20,v:120+Math.random()*120,k:r<0.12?"⭐":r<0.25?"🧅":"🍿"});}
   x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.08)";for(let i=0;i<6;i++)x.fillRect(i*W/6+10,0,2,H);
   x.font="30px sans-serif";x.textAlign="center";x.textBaseline="middle";
   for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.v*dt;x.fillText(it.k,it.x,it.y);
    if(it.y>H-50&&it.y<H-10&&Math.abs(it.x-bx)<38){items.splice(i,1);score+=it.k==="⭐"?5:it.k==="🧅"?-3:1;if(score<0)score=0;continue;}
    if(it.y>H+20)items.splice(i,1);}
   x.fillStyle="#E2465C";x.beginPath();x.moveTo(bx-34,H-48);x.lineTo(bx+34,H-48);x.lineTo(bx+26,H-6);x.lineTo(bx-26,H-6);x.closePath();x.fill();
   x.fillStyle="#fff";for(let i=-2;i<=2;i++)x.fillRect(bx+i*12-3,H-46,6,38);
   top.innerHTML="<span>Palomitas: "+score+"</span><span>⏱ "+Math.ceil(time)+" s</span>";
   raf=requestAnimationFrame(frame);}
  raf=requestAnimationFrame(frame);
  iv=setInterval(()=>{time--;if(time<=0){clearInterval(iv);cancelAnimationFrame(raf);const v=earn(score*6);finish("¡Fin de la función!","🍿<br>Atrapó "+score+" puntos<br>+$ "+v);}},1000);
 },{onClose:()=>{cancelAnimationFrame(raf);clearInterval(iv);}});
});}

function gameEscuela(){intro("Escuela","🏫","Responda 5 preguntas. Cada respuesta correcta le da dinero.",()=>{
 const qs=shuffle(QUIZ).slice(0,5);let i=0,ok=0,tot=0;
 sheet("Clase",body=>{
  const top=el("div","mg-top");const q=el("div","bubble");q.style.background="#EAF7FF";const opts=el("div","opts");body.append(top,q,opts);
  function next(){if(i>=qs.length){if(ok===5){S.mc+=2;toast("⭐ ¡Perfecto! +2 MediCoins");}finish("Clase terminada","🎓<br>Respuestas correctas: "+ok+" de 5<br>+$ "+tot);return;}
   const [t,a]=qs[i];top.innerHTML="<span>Pregunta "+(i+1)+" de 5</span><span>Correctas: "+ok+"</span>";q.textContent=t;opts.innerHTML="";
   shuffle(a).forEach(o=>{const b=el("button","opt",o);b.onclick=()=>{opts.querySelectorAll("button").forEach(x=>x.disabled=true);if(o===a[0]){b.classList.add("ok");ok++;tot+=earn(40);}else{b.classList.add("bad");opts.querySelectorAll("button").forEach(x=>{if(x.textContent===a[0])x.classList.add("ok");});}i++;setTimeout(next,900);};opts.appendChild(b);});}
  next();
 });
});}

 const ready=S.daily.last!==todayStr();const streak=(S.daily.last===yStr()||S.daily.last===todayStr())?S.daily.streak:0;const day=ready?streak+1:streak;const amt=DAILY[Math.min(Math.max(day,1),7)-1];
 const gift=el("div","li",'<div style="font-size:30px">📬</div><div class="tx"><b>Regalo diario · día '+Math.max(day,1)+'</b><small>'+(ready?"Hoy: "+amt+" MediCoins gratis":"Ya lo recogió. Vuelva mañana.")+'</small></div>');
 const gb=el("button","btn coinb",ready?"Recoger":"✓");gb.style.width="auto";gb.style.padding="8px 14px";gb.disabled=!ready;gb.onclick=()=>{S.daily.streak=day;S.daily.last=todayStr();S.mc+=amt;toast("🎁 +"+amt+" MediCoins");openCasa();};gift.appendChild(gb);body.appendChild(gift);
 const n=Object.keys(S.furn).length;
 body.appendChild(el("h3","","Mi sala"));

 body.appendChild(el("p","muted","Cada mueble aumenta 3 % lo que gana en todos los trabajos. Bono actual: +"+(n*3)+" %."));
 itemGrid(body,FURN.filter(f=>!S.furn[f.id]).map(f=>Object.assign({cur:"$"},f)),()=>"+3 % de ganancias",()=>false,()=>false,it=>{S.furn[it.id]=1;openCasa();});
});}

let last=performance.now(),saveT=0,coinT=0;
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;perf+=dt;
 updatePlayer(dt);updateCamera(dt);updateCars(dt);updateNPCs(dt);updateCoins(dt);updateFires(dt);updateArrow();
 coinT+=dt;if(coinT>2.5&&coins.length<30){coinT=0;spawnCoin();}
 for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>170)c.position.x=-170;}
 if(fountainDrop)fountainDrop.position.y=4.3+Math.abs(Math.sin(perf*3))*0.6;
 saveT+=dt;if(saveT>5){saveT=0;save();}
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
function start(){
 load();setQuality();resize();
 buildWorld();setupCars();setupNPCs();for(let i=0;i<22;i++)spawnCoin();
 buildPlayer();
 camera.position.set(P.x,P.y+6,P.z+12);
 $("loading").remove();
 $("hud").hidden=false;$("jump").hidden=false;
 if(isTouch)$("joyhint").hidden=false;else $("pchint").hidden=false;
 hud();
 $("mcBtn").onclick=()=>openShop("paquetes");$("bShop").onclick=()=>openShop("vehiculos");$("bCloset").onclick=()=>openCloset();$("bPlaces").onclick=openPlaces;$("bSet").onclick=openSettings;
 document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});addEventListener("pagehide",save);
 if(!S.created)welcome();else{toast("👋 ¡Hola de nuevo, "+S.name+"!");}
 setTimeout(()=>{if(!isTouch)$("pchint").hidden=true;},14000);
 requestAnimationFrame(t=>{last=t;loop(t);});
}
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
